<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RASA Vybe Quest</title>
<style>
:root{--rasa:#f4b400;--dark:#17130b;--cream:#fff9ed;--muted:#766d5e;--card:#fff;--green:#2e7d32}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eee;color:var(--dark)}
.app{width:min(430px,100%);min-height:100vh;margin:auto;background:var(--cream);overflow:hidden;position:relative}
header{padding:22px 20px 12px;display:flex;justify-content:space-between;align-items:center}
.brand-logo{display:flex;align-items:center;width:112px;height:58px;overflow:hidden;border-radius:12px;background:#fff}.brand-logo img{width:100%;height:100%;object-fit:contain;display:block}.points{background:#17130b;color:#fff;padding:8px 12px;border-radius:20px;font-size:13px;font-weight:700}
.progress{height:5px;background:#eadfca;margin:0 20px;border-radius:10px;overflow:hidden}.bar{height:100%;width:20%;background:var(--rasa);transition:.35s}
.screen{padding:28px 20px 34px;min-height:calc(100vh - 75px)}
.kicker{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#a46e00;text-transform:uppercase;margin-bottom:8px}
h1{font-size:31px;line-height:1.08;margin:0 0 12px}h2{font-size:24px;margin:0 0 10px}.sub{color:var(--muted);line-height:1.5;margin:0 0 24px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 24px rgba(40,30,10,.07);border:1px solid #f0e7d7}
.options{display:grid;gap:12px}.option{border:2px solid #eee2cd;background:#fff;border-radius:17px;padding:16px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.option:hover,.option.selected{border-color:var(--rasa);background:#fff7db}
.btn{width:100%;border:0;background:var(--dark);color:#fff;border-radius:16px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px}.btn.alt{background:var(--rasa);color:var(--dark)}
.mood-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mood{padding:22px 10px;border:2px solid #eee2cd;background:white;border-radius:20px;text-align:center;cursor:pointer;font-weight:800}.mood .emoji{font-size:35px;display:block;margin-bottom:8px}.mood.selected{border-color:var(--rasa);background:#fff7db}
.flavour{background:#17130b;color:white;border-radius:25px;padding:25px;text-align:center;margin:20px 0}.flavour .cup{font-size:64px}.flavour h2{margin:7px 0;color:#ffd55a}.tag{display:inline-block;background:#fff2b8;color:#5a4100;border-radius:30px;padding:7px 11px;font-size:12px;font-weight:800}
.game{background:#17130b;color:white;border-radius:24px;padding:22px}.game-target{font-size:42px;text-align:center;margin:8px}.tap-area{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.fruit{height:72px;min-width:0;border:2px solid #eadfca;border-radius:18px;background:#fff;color:#17130b;font-size:34px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.fruit:hover{border-color:var(--rasa);background:#fff7db}.fruit:active{transform:scale(.94)}.status{text-align:center;color:#ddd;margin:10px 0;font-size:13px}
.reward{text-align:center;padding-top:25px}.reward-icon{font-size:80px}.coupon{background:white;border:2px dashed #c59b2d;border-radius:20px;padding:20px;margin:22px 0}.code{font-size:25px;font-weight:900;letter-spacing:3px;margin:10px 0}.small{font-size:12px;color:var(--muted);line-height:1.5}
.back{border:0;background:none;font-weight:700;color:var(--muted);padding:0;margin-bottom:20px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#17130b;color:#fff;padding:12px 18px;border-radius:30px;font-size:13px;display:none;z-index:10}
</style>
</head>

{icon:"🎟️",tag:"MINIMUM PURCHASE",code:"RASA30",title:"₹30 OFF",detail:"Get ₹30 off on a minimum purchase of ₹100."}
];
const state={step:0,mood:null,flavour:null,points:0,gameScore:0,reward:null,challengeAttempts:3};
const flavours={
energetic:{name:"Nimbu Soda (Spark)",desc:"Fresh, zesty and refreshing.",emoji:"🍋",tag:"For your energetic vybe"},
chill:{name:"Rose Sharbat Chill",desc:"Sweet, refreshing and calming.",emoji:"🌹",tag:"For your chill vybe"},

function render(){

document.getElementById("bar").style.width=((state.step+1)*20)+"%";

<button class="btn alt" onclick="start()">Start the Quest</button>`;
if(state.step===1) s.innerHTML=`

<button class="option" onclick="pickMood('bold',this)">🔥 Bold & adventurous</button>
</div><button class="btn" onclick="nextMood()">Continue</button>`;
if(state.step===2) s.innerHTML=`

  const btn=document.getElementById("gameBtn");
  const tap=document.getElementById("tap");
  const chancesEl=document.getElementById("chances");
  btn.disabled=true;
  btn.textContent="Challenge Running…";
  if(chancesEl) chancesEl.textContent=state.challengeAttempts;

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function renderChoices(){
    document.getElementById("target").textContent=currentTarget;
    tap.innerHTML="";
    let choices=shuffle(allEmojis);

    choices.forEach(emoji=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="fruit";
      b.setAttribute("aria-label","Choose "+emoji);
      b.textContent=emoji;
      b.addEventListener("click",()=>{
        if(b.disabled || !interval) return;

        if(emoji===currentTarget){
          score++;
          state.gameScore=score;
          state.points+=5;
          document.getElementById("gs").textContent=score;
          toast("Correct! +5 points");

          if(score>=8){
            finish(true);
            return;
          }

          const remaining=allEmojis.filter(x=>x!==currentTarget);
          currentTarget=remaining[Math.floor(Math.random()*remaining.length)];
          renderChoices();
        }else{
          wrong++;
          if(wrong%2===0){
            state.points=Math.max(0,state.points-1);
            toast("Wrong emoji! −1 point");
          }else{
            toast("Wrong emoji — try again!");
          }
        }
      });
      tap.appendChild(b);
    });
  }

  renderChoices();

  interval=setInterval(()=>{
    time--;
    const timer=document.getElementById("timer");
    if(timer) timer.textContent=time;
    if(time<=0) finish(false);
  },1000);

  function finish(won){
    if(!interval) return;
    clearInterval(interval);
    interval=null;

    if(won){
      state.points+=20;
      state.reward=rewards[Math.floor(Math.random()*rewards.length)];
      state.step=5;
      render();
    }else{
      state.challengeAttempts--;
      if(state.challengeAttempts>0){
        toast("Time's up! Chance used.");
        btn.disabled=false;
        btn.textContent="Try Again";
        const c=document.getElementById("chances");
        if(c) c.textContent=state.challengeAttempts;
        document.getElementById("timer").textContent="10";
      }else{
        state.step=6;
        render();
      }
    }
  }
}
function restart(){state.step=0;state.mood=null;state.flavour=null;state.points=0;state.gameScore=0;state.reward=null;state.challengeAttempts=3;render()}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display="none",1600)}
render();
</script>
</body>
</html>
